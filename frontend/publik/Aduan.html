<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengaduan Warga Desa Sumorame | Layanan Aspirasi</title>
  <meta name="description" content="Sampaikan aspirasi dan pengaduan warga kepada Pemerintah Desa Sumorame melalui layanan pengaduan resmi untuk warga terverifikasi." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://ppid-sumoramedesa.id/Aduan" />
  <meta property="og:title" content="Pengaduan Warga Desa Sumorame" />
  <meta property="og:description" content="Kanal resmi aspirasi dan pengaduan warga Desa Sumorame." />
  <meta property="og:url" content="https://ppid-sumoramedesa.id/Aduan" />
  <meta property="og:type" content="website" />
  <script src="/js/site-components.js?v=20260913-2"></script>
    <script src="/js/auth-ui.js?v=20260828-1"></script>
  <link rel="icon" href="img/logo3.png?v=20260824-1" type="image/png">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="css/Aduan.css?v=20260824-2">
  <link rel="stylesheet" href="css/hero-responsive.css?v=20260829-1">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#004b24",
            "primary-container": "#006633",
            secondary: "#745b00",
            "secondary-container": "#fecb00",
            background: "#fbf9f8",
            surface: "#fbf9f8",
            "on-surface": "#1b1c1c",
            "on-surface-variant": "#3f4940"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans"],
            body: ["Inter"],
            label: ["Work Sans"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/layout-responsive.css?v=20260902-1">
</head>

<body class="bg-surface font-body text-on-surface">
    <site-header></site-header>


  <!-- HERO -->
  <section id="heroSection" class="public-hero relative overflow-hidden bg-primary flex items-center">

      <!-- Background -->
      <img src="https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1200&q=80"
          alt="Layanan aspirasi dan pengaduan Desa Sumorame"
          class="hero-background absolute inset-0 w-full h-full object-cover object-[center_40%] opacity-50">

      <!-- Overlay -->
      <div class="absolute inset-0 bg-black/30"></div>

      <!-- Content -->
      <div class="public-hero__content relative z-10">

          <!-- Judul -->
          <h2 class="public-hero__title font-bold text-white mb-4 leading-tight">
                Layanan Aspirasi dan Pengaduan Desa
          </h2>

          <!-- Deskripsi -->
          <p id="heroItem"
            class="public-hero__subtitle hero-item text-white/90">
              Selamat Datang Di Desa Sumorame.
          </p>

      </div>
  </section>

      <!-- CONTENT -->
      <main class="pt-24 max-w-7xl mx-auto px-6">
        <div id="cardAduan" class="max-w-xl mx-auto mt-10 bg-white shadow-lg rounded-xl overflow-hidden opacity-0 translate-y-16 scale-95 transition-all duration-700">
          <!-- HEADER CARD -->
          <div class="bg-green-700 text-white text-center py-4">
            <h2 class="text-lg font-bold">Sampaikan Laporan Anda</h2>
          </div>

          <!-- BODY CARD -->
          <div class="p-6">
            <form id="formAduan" class="flex flex-col gap-4">
              <!-- Nama -->
              <div>
                <label class="text-sm font-semibold">Nama</label>
                <input type="text" id="nama" placeholder="Masukkan nama"
                  class="w-full mt-1 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
              </div>

              <!-- Email -->
              <div>
                <label class="text-sm font-semibold">Email</label>
                <input type="email" id="email" placeholder="Masukkan email"
                  class="w-full mt-1 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
              </div>

              <div>
                <label class="text-sm font-bold text-gray-800">Nomor WhatsApp <span class="text-red-500">*</span></label>
                <input type="text" id="no_wa" placeholder="Contoh: 6281234567890" required class="w-full border rounded px-3 py-2 ...">
              </div>

              <!-- Judul Aduan -->
              <div>
                <label class="text-sm font-semibold">Judul Aduan</label>
                <input type="text" id="judul" placeholder="Masukkan judul aduan"
                  class="w-full mt-1 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
              </div>

              <!-- Isi Aduan -->
              <div>
                <label class="text-sm font-semibold">Ketik Aduan Anda</label>
                <textarea id="isi" rows="4" placeholder="Tulis laporan anda..."
                  class="w-full mt-1 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
              </div>

              <!-- Upload Bukti -->
              <div>
                <label class="text-sm font-semibold">Upload Bukti</label>

                <input type="file" id="fileUpload"
                  accept=".jpg,.jpeg,.png,.pdf"
                  class="w-full mt-1 px-3 py-2 border rounded-md bg-white cursor-pointer
                  focus:outline-none focus:ring-2 focus:ring-green-600">

                <p class="text-xs text-gray-500 mt-1">
                  Format yang diperbolehkan: JPG, PNG, PDF (Maks 2MB)
                </p>
              </div>
              <img id="previewImage" class="mt-3 hidden w-full rounded-lg border" />

              <!-- BUTTON -->
              <div class="text-right">
                <button type="submit"
                  class="bg-green-700 text-white px-4 py-2 rounded-md text-sm hover:bg-green-800 transition">
                  Lapor
                </button>
              </div>
            </form>

            <!-- TRACK RECORDS ADUAN -->
            <div id="trackAduan" class="mt-10 hidden">

              <h3 class="text-lg font-bold mb-6 text-green-800 text-center">
                Tracking Aduan
              </h3>

              <!-- TIMELINE -->
              <div id="timelineAduan" class="flex items-center relative mb-8">

                <!-- GARIS -->
                <div class="absolute top-1/2 left-0 right-0 h-1 bg-gray-300 -translate-y-1/2"></div>

                  <!-- STEP 1 -->
                  <div class="flex-1 flex justify-center relative z-10">
                    <div class="bg-green-600 text-white w-10 h-10 flex items-center justify-center rounded-full">
                      <span class="material-symbols-outlined">send</span>
                    </div>
                  </div>

                  <!-- STEP 2 -->
                  <div class="flex-1 flex justify-center relative z-10">
                    <div class="bg-green-600 text-white w-10 h-10 flex items-center justify-center rounded-full">
                      <span class="material-symbols-outlined">autorenew</span>
                    </div>
                  </div>

                  <!-- STEP 3 -->
                  <div class="flex-1 flex justify-center relative z-10">
                    <div class="bg-green-600 text-white w-10 h-10 flex items-center justify-center rounded-full">
                      <span class="material-symbols-outlined">check_circle</span>
                    </div>
                  </div>

                </div>

              </div>

              <!-- DETAIL -->
              <div id="listAduan" class="space-y-4"></div>

            </div>
          </div>
          
          <!-- MODAL LOGIN -->
          <div id="loginModal" class="fixed inset-0 z-[100] bg-black/50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
            <div class="bg-white rounded-xl p-6 w-[min(22rem,calc(100vw-2rem))] text-center shadow-lg scale-95 transition-all duration-300" id="modalBox">
              
              <span class="material-symbols-outlined text-4xl text-emerald-700 mb-2">lock</span>
              <h2 id="loginModalTitle" class="text-lg font-bold mb-2">Login Warga Diperlukan</h2>
              <p class="text-sm text-gray-600 mb-4">Hanya warga terdaftar yang dapat mengisi dan mengirim aduan.</p>

              <button id="btnLogin"
                class="bg-green-700 text-white px-4 py-2 rounded-md hover:bg-green-800 transition w-full">
                Login Warga
              </button>

              <button id="btnTutupLogin" type="button"
                class="mt-3 text-sm text-gray-500 hover:text-emerald-800 transition">
                Nanti Saja
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- Scroll To Top -->
        <button id="scrollTopBtn"
            class="fixed bottom-6 right-6 w-12 h-12 bg-emerald-700 hover:bg-emerald-800
                  text-white rounded-full shadow-lg flex items-center justify-center
                  opacity-0 invisible transition-all duration-300 hover:scale-110 z-50">

            <span class="material-symbols-outlined">
                keyboard_arrow_up
            </span>

        </button>

  

  <script src="js/api-config.js"></script>
  <script src="js/Aduan.js?v=20260828-2"></script>
  <script src="js/tiktok-link.js?v=20260828-1"></script>
  <site-footer></site-footer>
  </body>
</html>
