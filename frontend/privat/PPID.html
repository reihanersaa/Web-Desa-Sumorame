<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="../img/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<body class="bg-gray-200">

<!-- HEADER -->
<header class="fixed top-0 left-0 right-0 h-16 bg-white border-b flex z-50">
  <div id="headerLeft"

    <img src="../img/logo2.png" class="h-20 object-contain" />
  </div>

  <div class="flex-1 flex items-center justify-between px-4">
    <div class="flex items-center">
      <button id="burgerBtn" class="mr-4">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <h1 class="font-semibold text-lg">PPID</h1>
    </div>

    <a href="LoginAdmin.html" 
      class="flex items-center gap-2 text-sm text-gray-600 hover:text-black transition">
      <span class="material-symbols-outlined text-base">logout</span>
      <span>Logout</span>
    </a>
  </div>
</header>

<aside id="sidebar"
  class="fixed top-16 left-0 w-64 h-[calc(100%-4rem)] bg-black text-white p-4 transition-all duration-300 -translate-x-full md:translate-x-0">

  <nav class="space-y-2 text-sm">

    <!-- Dashboard (Aktif) -->
    <a href="DashboardAdmin.html" class="flex items-center p-2 hover:bg-gray-700 hover:translate-x-1 transition-all rounded">
      <span class="material-symbols-outlined mr-3">home</span>
      <span class="menu-text">Dashboard</span>
    </a>

  

    <!-- Aduan -->
    <a href="Pengaduan.html" class="flex items-center p-2 hover:bg-gray-700 hover:translate-x-1 transition-all rounded">
      <span class="material-symbols-outlined mr-3">campaign</span>

    </a>

    <a href="SuratMenyurat.html" class="flex items-center p-2 hover:bg-gray-700 hover:translate-x-1 transition-all rounded">

      <span class="menu-text">Surat Menyurat</span>
    </a>

    <!-- Publikasi -->
    <a href="Publikasi.html" class="flex items-center p-2 hover:bg-gray-700 hover:translate-x-1 transition-all rounded">
      <span class="material-symbols-outlined mr-3">linked_camera</span>
      <span class="menu-text">Publikasi</span>
    </a>

    <div>

          <span class="material-symbols-outlined mr-3">web</span>
          <span class="menu-text">Kelola Website</span>
        </span>
        <span id="cmsIcon" class="material-symbols-outlined text-sm transition-transform">

      </button>

      <div id="cmsMenu" class="ml-6 mt-1 space-y-1 overflow-hidden max-h-0 opacity-0 transition-all duration-300 ease-in-out">
        <a href="CmsProfil.html" class="flex items-center gap-2 p-2 text-gray-300 hover:bg-gray-700 hover:translate-x-1 transition-all rounded">
          <span class="material-symbols-outlined text-xs">chevron_right</span>

        </a>

        <a href="CmsProduk.html" class="flex items-center gap-2 p-2 text-gray-300 hover:bg-gray-700 hover:translate-x-1 transition-all rounded">

        </a>

        <a href="Kelembagaan.html" class="flex items-center gap-2 p-2 text-gray-300 hover:bg-gray-700 hover:translate-x-1 transition-all rounded">

          Kelembagaan
        </a>

        <a href="PPID.html" class="flex items-center gap-2 p-2 text-gray-300 bg-gray-700 translate-x-1 transition-all rounded">
