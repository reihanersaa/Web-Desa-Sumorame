<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Informasi kelembagaan dan struktur pemerintahan Desa Sumorame, Kecamatan Candi, Kabupaten Sidoarjo." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://ppid-sumoramedesa.id/Lembaga" />
    <meta property="og:title" content="Kelembagaan Desa Sumorame" />
    <meta property="og:description" content="Kenali lembaga dan struktur pemerintahan Desa Sumorame." />
    <meta property="og:url" content="https://ppid-sumoramedesa.id/Lembaga" />
    <meta property="og:type" content="website" />
    <script src="/js/auth-ui.js?v=20260828-1"></script>
    <link rel="icon" href="img/logo3.png?v=20260824-1" type="image/png" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/Lembaga.css" />
    <link rel="stylesheet" href="css/hero-responsive.css?v=20260829-1" />

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#004b24",
              "primary-container": "#006633",
              secondary: "#745b00",
              "secondary-container": "#fecb00",
              background: "#fbf9f8",
              surface: "#fbf9f8",
              "on-surface": "#1b1c1c",
              "on-surface-variant": "#3f4940",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Inter"],
              label: ["Work Sans"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/layout-responsive.css?v=20260902-1" />
  </head>

  <body class="bg-surface font-body text-on-surface">
    <!-- HEADER -->
    <header
      id="mainHeader"
      class="bg-gradient-to-r from-green-200/70 via-gray-200/70 to-teal-200/70 backdrop-blur-xl fixed top-0 w-full z-50 shadow-md"
    >
      <div
        class="flex justify-between items-center max-w-7xl mx-auto px-6 h-16"
      >
        <!-- Logo -->
        <div class="flex items-center gap-3">
          <div class="logo">
            <img
              src="img/logo3.png"
              alt="Logo Desa Digital"
              width="40"
              height="36"
            />
          </div>
          <h1 class="font-headline text-xl font-bold text-emerald-900">
            Desa Sumorame
          </h1>
        </div>

        <!-- NAVBAR -->
        <nav class="hidden md:flex items-center font-medium text-green-900">
          <a href="/" class="nav-item relative px-5 font-bold"
            >Profile Desa</a
          >
          <div class="h-5 w-[1px] bg-gray-400"></div>

          <a href="/PPID" class="nav-item relative px-5 font-bold">PPID</a>
          <div class="h-5 w-[1px] bg-gray-400"></div>

          <a href="#" class="nav-item relative px-5 font-bold">Lembaga</a>
          <div class="h-5 w-[1px] bg-gray-400"></div>

          <a href="/Informasi" class="nav-item relative px-5 font-bold"
            >Informasi</a
          >
          <div class="h-5 w-[1px] bg-gray-400"></div>

          <a
            href="/AdminP"
            class="nav-item relative px-5 font-bold text-green-800"
            >Administrasi Persuratan</a
          >
          <div class="h-5 w-[1px] bg-gray-400"></div>

          <a href="/Aduan" class="nav-item relative px-5 font-bold"
            >Aduan</a
          >
          <div class="h-5 w-[1px] bg-gray-400"></div>

          <a href="/Publikasi" class="nav-item relative px-5 font-bold"
            >Publikasi</a
          >
        </nav>

        <!-- Logout -->
        <a
          href="/login"
          class="nav-item hidden md:flex items-center text-black hover:text-black-700 transition"
        >
          <span class="material-symbols-outlined">logout</span>
        </a>

        <!-- Right Section -->
        <div class="flex items-center gap-4">
          <!-- Hamburger (Mobile Only) -->
          <button
            id="menuBtn"
            class="md:hidden material-symbols-outlined text-emerald-900 text-3xl"
          >
            menu
          </button>
        </div>
      </div>
    </header>

    <!-- MOBILE MENU -->
    <div
      id="mobileMenu"
      class="flex flex-col bg-white md:hidden fixed top-16 left-0 w-full z-40 shadow-md max-h-0 overflow-hidden opacity-0 transition-all duration-300"
    >
      <a
        href="/"
        class="py-4 px-6 border-b border-gray-300 font-semibold text-emerald-900 hover:bg-gray-100 transition"
        >Profile Desa</a
      >
      <a
        href="/PPID"
        class="py-4 px-6 border-b border-gray-300 font-semibold text-emerald-900 hover:bg-gray-100 transition"
        >PPID</a
      >
      <a
        href="#"
        class="py-4 px-6 border-b border-gray-300 font-semibold text-emerald-900 hover:bg-gray-100 transition"
        >Lembaga</a
      >
      <a
        href="/Informasi"
        class="py-4 px-6 border-b border-gray-300 font-semibold text-emerald-900 hover:bg-gray-100 transition"
        >Informasi</a
      >
      <a
        href="/AdminP"
        class="py-4 px-6 border-b border-gray-300 font-semibold text-emerald-900 hover:bg-gray-100 transition"
        >Administrasi Persuratan</a
      >
      <a
        href="/Aduan"
        class="py-4 px-6 border-b border-gray-300 font-semibold text-emerald-900 hover:bg-gray-100 transition"
        >Aduan</a
      >
      <a
        href="/Publikasi"
        class="py-4 px-6 border-b border-gray-300 font-semibold text-emerald-900 hover:bg-gray-100 transition"
        >Publikasi</a
      >
      <a
        href="/login"
        class="py-4 px-6 border-b border-gray-300 font-semibold text-emerald-900 hover:bg-gray-100 transition"
        >Log Out</a
      >
    </div>

    <!-- HERO -->
    <section
      id="heroSection"
      class="public-hero relative overflow-hidden bg-primary flex items-center"
    >
      <!-- Background -->
      <img
        src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80"
        alt="Badan kelembagaan Desa Sumorame"
        class="absolute inset-0 w-full h-full object-cover object-[center_40%] opacity-50"
      />

      <!-- Overlay -->
      <div class="absolute inset-0 bg-black/30"></div>

      <!-- Content -->
      <div class="public-hero__content relative z-10">
        <!-- Judul -->
        <h2
          class="public-hero__title font-bold text-white mb-4 leading-tight"
        >
          Badan Kelembagaan Desa
        </h2>

        <!-- Deskripsi -->
        <p
          id="heroItem"
          class="public-hero__subtitle hero-item text-white/90"
        >
          Selamat Datang Di Desa Sumorame.
        </p>
      </div>
    </section>

    <!-- ====================================================== -->
    <!-- MAIN CONTENT KELEMBAGAAN -->
    <!-- ====================================================== -->
    <main class="pt-28 max-w-5xl mx-auto px-6 text-center">
      <!-- ==================================================== -->
      <!-- CONTAINER DATA KELEMBAGAAN -->
      <!-- Data dari public.kelembagaan akan dimasukkan ke sini -->
      <!-- melalui JavaScript Lembaga.js -->
      <!-- ==================================================== -->
      <div id="kelembagaanContainer">
        <!-- ================= LOADING ================= -->
        <div
          id="loadingKelembagaan"
          class="py-16 flex flex-col items-center justify-center gap-3 text-gray-500"
        >
          <span class="material-symbols-outlined text-4xl animate-spin">
            progress_activity
          </span>

          <p class="text-base md:text-lg">Memuat data kelembagaan...</p>
        </div>
      </div>
    </main>

    <!-- Scroll To Top -->
    <button
      id="scrollTopBtn"
      class="fixed bottom-6 right-6 w-12 h-12 bg-emerald-700 hover:bg-emerald-800 text-white rounded-full shadow-lg flex items-center justify-center opacity-0 invisible transition-all duration-300 hover:scale-110 z-50"
    >
      <span class="material-symbols-outlined"> keyboard_arrow_up </span>
    </button>

    

    <script src="js/api-config.js"></script>
    <script src="js/Lembaga.js"></script>
    <script src="js/header-scroll.js?v=20260826-1"></script>
    <script src="js/tiktok-link.js?v=20260828-1"></script>
    <script src="js/footer.js?v=20260902-1"></script>
  </body>
