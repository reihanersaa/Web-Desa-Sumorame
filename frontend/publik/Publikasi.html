<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publikasi Desa Sumorame | Kegiatan dan Dokumentasi</title>
    <meta name="description" content="Publikasi resmi, dokumentasi kegiatan, dan informasi terbaru Pemerintah Desa Sumorame, Kecamatan Candi, Kabupaten Sidoarjo." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://ppid-sumoramedesa.id/Publikasi" />
    <meta property="og:title" content="Publikasi Desa Sumorame" />
    <meta property="og:description" content="Dokumentasi kegiatan dan publikasi terbaru Desa Sumorame." />
    <meta property="og:url" content="https://ppid-sumoramedesa.id/Publikasi" />
    <meta property="og:type" content="website" />
    <script src="/js/site-components.js?v=20260913-2"></script>
    <script src="/js/auth-ui.js?v=20260828-1"></script>
    <link rel="icon" href="img/logo3.png?v=20260824-1" type="image/png" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/hero-responsive.css?v=20260829-1" />
    <link rel="stylesheet" href="css/Publikasi.css?v=20260828-1" />

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#004b24",
              "primary-container": "#006633",
              secondary: "#745b00",
              "secondary-container": "#fecb00",
              background: "#fbf9f8",
              surface: "#fbf9f8",
              "on-surface": "#1b1c1c",
              "on-surface-variant": "#3f4940",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Inter"],
              label: ["Work Sans"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/layout-responsive.css?v=20260902-1" />
  </head>

  <body class="bg-surface font-body text-on-surface overflow-x-hidden">
    <site-header></site-header>


    <!-- HERO -->
    <section id="heroSection" class="public-hero group relative overflow-hidden bg-primary">

      <!-- SLIDER DINAMIS -->
      <div
        id="slider"
        class="flex items-start transition-transform duration-700 ease-in-out"
      >
        <!-- 3 gambar terbaru akan dimasukkan lewat Publikasi.js -->
      </div>

      <!-- BUTTON PREV -->
      <button
        id="prev"
        aria-label="Slide sebelumnya"
        class="absolute left-4 top-1/2 -translate-y-1/2
              bg-white/50 hover:bg-white/80
              px-3 py-2 rounded z-20
              opacity-0 pointer-events-none
              group-hover:opacity-100 group-hover:pointer-events-auto
              focus-visible:opacity-100 focus-visible:pointer-events-auto
              transition-opacity duration-300"
      >
        ❮
      </button>

      <!-- BUTTON NEXT -->
      <button
        id="next"
        aria-label="Slide berikutnya"
        class="absolute right-4 top-1/2 -translate-y-1/2
              bg-white/50 hover:bg-white/80
              px-3 py-2 rounded z-20
              opacity-0 pointer-events-none
              group-hover:opacity-100 group-hover:pointer-events-auto
              focus-visible:opacity-100 focus-visible:pointer-events-auto
              transition-opacity duration-300"
      >
        ❯
      </button>

    </section>

    <!-- CONTENT (KOSONG) -->
    <main class="pt-28 max-w-7xl mx-auto px-6">
      <!-- TITLE -->
      <div class="text-center mb-12">
        <h3
          class="title-loop font-poppins text-3xl font-bold text-green-900 mb-2"
        >
          Publikasi Kegiatan Desa
        </h3>
        <p class="text-gray-600 font-poppins">
          Dokumentasi kegiatan dan informasi terbaru Desa Sumorame
        </p>
      </div>

      <!-- GRID CARD PUBLIKASI (diisi otomatis lewat js/Publikasi.js) -->
      <div
        id="publikasiGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center"
        aria-live="polite"
      >
        <p class="col-span-full text-center text-gray-400 py-10">
          Memuat publikasi...
        </p>
      </div>

      <div class="mt-10 flex justify-center">
        <button
          id="loadMorePublikasi"
          type="button"
          class="hidden min-h-11 rounded-xl bg-emerald-800 px-6 py-3 font-semibold text-white shadow-md transition hover:bg-emerald-900 disabled:cursor-wait disabled:opacity-60"
        >
          Muat lebih banyak
        </button>
      </div>

      <!-- MODAL -->
      <div
        id="modal"
        class="fixed inset-0 bg-black/60 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 z-50"
      >
        <div
          id="modalContent"
          class="bg-white rounded-xl overflow-hidden max-w-lg w-full transform scale-90 opacity-0 transition-all duration-300 relative"
        >
          <!-- Tombol X -->
          <button
            id="closeModal"
            class="absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-md bg-white/70 backdrop-blur-md text-gray-700 hover:text-white hover:bg-green-400 hover:scale-105 transition-all duration-200 shadow-md"
          >
            ✕
          </button>

          <!-- ISI DINAMIS -->
          <img id="modalImg" class="w-full h-60 object-cover" />

          <div class="p-5 bg-green-50">
            <h4
              id="modalTitle"
              class="text-lg font-bold text-green-800 mb-2"
            ></h4>
            <p id="modalDesc" class="text-gray-600 text-sm"></p>
            <p id="modalDate" class="text-xs text-gray-400 mt-3"></p>
          </div>
        </div>
      </div>

      <!-- Scroll To Top -->
      <button
        id="scrollTopBtn"
        class="fixed bottom-6 right-6 w-12 h-12 bg-emerald-700 hover:bg-emerald-800 text-white rounded-full shadow-lg flex items-center justify-center opacity-0 invisible transition-all duration-300 hover:scale-110 z-50"
      >
        <span class="material-symbols-outlined"> keyboard_arrow_up </span>
      </button>
    </main>



    <script src="js/api-config.js"></script>
    <script src="js/Publikasi.js?v=20260828-2"></script>
    <script src="js/tiktok-link.js?v=20260828-1"></script>
    <site-footer></site-footer>
  </body>
</html>
