<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelembagaan Desa Sumorame | Pemerintahan Desa</title>
    <meta name="description" content="Informasi kelembagaan dan struktur pemerintahan Desa Sumorame, Kecamatan Candi, Kabupaten Sidoarjo." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://ppid-sumoramedesa.id/Lembaga" />
    <meta property="og:title" content="Kelembagaan Desa Sumorame" />
    <meta property="og:description" content="Kenali lembaga dan struktur pemerintahan Desa Sumorame." />
    <meta property="og:url" content="https://ppid-sumoramedesa.id/Lembaga" />
    <meta property="og:type" content="website" />
    <script src="/js/site-components.js?v=20260913-2"></script>
    <script src="/js/auth-ui.js?v=20260828-1"></script>
    <link rel="icon" href="img/logo3.png?v=20260824-1" type="image/png" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/Lembaga.css" />
    <link rel="stylesheet" href="css/hero-responsive.css?v=20260829-1" />

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#004b24",
              "primary-container": "#006633",
              secondary: "#745b00",
              "secondary-container": "#fecb00",
              background: "#fbf9f8",
              surface: "#fbf9f8",
              "on-surface": "#1b1c1c",
              "on-surface-variant": "#3f4940",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Inter"],
              label: ["Work Sans"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/layout-responsive.css?v=20260902-1" />
  </head>

  <body class="bg-surface font-body text-on-surface">
    <site-header></site-header>


    <!-- HERO -->
    <section
      id="heroSection"
      class="public-hero relative overflow-hidden bg-primary flex items-center"
    >
      <!-- Background -->
      <img
        src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80"
        alt="Badan kelembagaan Desa Sumorame"
        class="absolute inset-0 w-full h-full object-cover object-[center_40%] opacity-50"
      />

      <!-- Overlay -->
      <div class="absolute inset-0 bg-black/30"></div>

      <!-- Content -->
      <div class="public-hero__content relative z-10">
        <!-- Judul -->
        <h2
          class="public-hero__title font-bold text-white mb-4 leading-tight"
        >
          Badan Kelembagaan Desa
        </h2>

        <!-- Deskripsi -->
        <p
          id="heroItem"
          class="public-hero__subtitle hero-item text-white/90"
        >
          Selamat Datang Di Desa Sumorame.
        </p>
      </div>
    </section>

    <!-- ====================================================== -->
    <!-- MAIN CONTENT KELEMBAGAAN -->
    <!-- ====================================================== -->
    <main class="pt-28 max-w-5xl mx-auto px-6 text-center">
      <!-- ==================================================== -->
      <!-- CONTAINER DATA KELEMBAGAAN -->
      <!-- Data dari public.kelembagaan akan dimasukkan ke sini -->
      <!-- melalui JavaScript Lembaga.js -->
      <!-- ==================================================== -->
      <div id="kelembagaanContainer">
        <!-- ================= LOADING ================= -->
        <div
          id="loadingKelembagaan"
          class="py-16 flex flex-col items-center justify-center gap-3 text-gray-500"
        >
          <span class="material-symbols-outlined text-4xl animate-spin">
            progress_activity
          </span>

          <p class="text-base md:text-lg">Memuat data kelembagaan...</p>
        </div>
      </div>
    </main>

    <!-- Scroll To Top -->
    <button
      id="scrollTopBtn"
      class="fixed bottom-6 right-6 w-12 h-12 bg-emerald-700 hover:bg-emerald-800 text-white rounded-full shadow-lg flex items-center justify-center opacity-0 invisible transition-all duration-300 hover:scale-110 z-50"
    >
      <span class="material-symbols-outlined"> keyboard_arrow_up </span>
    </button>

    

    <script src="js/api-config.js"></script>
    <script src="js/Lembaga.js"></script>
    <script src="js/tiktok-link.js?v=20260828-1"></script>
    <site-footer></site-footer>
  </body>
</html>
